name: validate submission

on:
  pull_request:
    branches: [main]
    paths:
      - "rices/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate changed submissions
        run: python scripts/validate_submission.py origin/${{ github.base_ref }}
